plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.uvccapturelite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.uvccapturelite'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '0.2-auto-open'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

configurations.configureEach {
    // UVCAndroid still pulls legacy split Kotlin JDK7/JDK8 artifacts (1.6.21).
    // Newer Kotlin stdlib already contains those classes, so keeping both creates
    // Duplicate class errors during :app:checkDebugDuplicateClasses.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.herohan:UVCAndroid:1.0.13'
}
